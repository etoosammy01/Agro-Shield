<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/assets/favicon_io/favicon-32x32.png">
    <title>Take a Selfie | Agro-Shield</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/register.css">
    <link rel="stylesheet" href="/static/css/register-extra.css">
    <link rel="stylesheet" href="/static/css/complete-profile.css">
</head>
<body>
<main class="auth-container complete-profile-container">
    <section class="auth-right complete-profile-panel">
        <div class="auth-form-wrapper">
            <img class="auth-brand" src="/static/assets/logo/Agro-Shield_logo.png" alt="Agro-Shield">
            <form id="complete-profile-form" action="/complete-profile" method="POST" enctype="multipart/form-data">
                <p class="onboarding-step">Complete registration · Step 1 of 2</p>
                <h2>Take a selfie</h2>
                <p class="complete-profile-subtitle">Allow camera access and take a clear photo of your face. This will be your profile picture.</p>
                {{if .Error}}<p class="message" role="alert">{{.Error}}</p>{{end}}
                <div class="selfie-camera">
                    <video id="selfie-video" autoplay muted playsinline aria-label="Live camera preview"></video>
                    <img id="selfie-preview" alt="Your captured selfie" hidden>
                </div>
                <p id="camera-status" class="onboarding-status" role="status" aria-live="polite">Opening your camera…</p>
                <div class="selfie-actions">
                    <button type="button" id="capture-button" class="secondary-button" disabled>Take selfie</button>
                    <button type="button" id="retake-button" class="secondary-button" hidden>Retake</button>
                    <button type="button" id="camera-retry-button" class="secondary-button" hidden>Retry camera</button>
                </div>
                <button type="submit" id="continue-button" disabled>Continue to phone verification</button>
                <noscript><p class="message">Enable JavaScript to take a selfie with your camera.</p></noscript>
            </form>
            <a class="onboarding-exit" href="/logout">Log out</a>
        </div>
    </section>
</main>
<script src="/static/js/complete-profile.js"></script>
</body>
</html>
