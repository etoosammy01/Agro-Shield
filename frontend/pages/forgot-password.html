<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" sizes="180x180" href="static/assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="static/assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="static/assets/favicon_io/site.webmanifest">

    <title>Forgot Password | Agro-Shield</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-left">

        <h1>Reset Password</h1>

        <p>
            Enter the phone number on your account, then confirm the code we text
            you before choosing a new password.
        </p>

    </div>

    <div class="auth-right">

        <form id="forgot-form" method="POST" action="/forgot-password">

            <h2>Forgot Password</h2>

            {{if .Error}}
            <p class="message" style="color:red;">{{.Error}}</p>
            {{end}}

            {{if .Success}}
            <p class="message" style="color:green;">{{.Success}}</p>
            {{end}}

            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Enter your phone number" required>

            <button type="submit" name="action" value="send_code" formnovalidate>
                {{if .CodeSent}}Resend code{{else}}Send verification code{{end}}
            </button>

            {{if .CodeSent}}
            <label for="code">Verification Code</label>
            <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}"
                   maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" required>
            {{end}}

            <label for="new_password">New Password</label>

            <div class="password-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="new_password" name="new_password" placeholder="At least 8 characters" required>
                <i class="fa-solid fa-eye toggle-password"></i>
            </div>

            <label for="confirm_password">Confirm New Password</label>

            <div class="password-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                <i class="fa-solid fa-eye toggle-password"></i>
            </div>

            <button type="submit">Reset Password</button>

            <p><a href="/login">Back to login</a></p>

        </form>

    </div>

</div>
<script>
    document.querySelectorAll('.toggle-password').forEach(function (icon) {
        icon.addEventListener('click', function () {
            var input = icon.parentElement.querySelector('input');
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !show);
            icon.classList.toggle('fa-eye-slash', show);
        });
    });
</script>

</body>
</html>
