<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" sizes="180x180" href="static/assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="static/assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="static/assets/favicon_io/site.webmanifest">


    <title>Create Account | Agro-Shield</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/register.css">
    <link rel="stylesheet" href="/static/css/register-extra.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="auth-container">

        <!-- LEFT SIDE -->
        <section class="auth-left">

            <h1>Join Agro-Shield</h1>

            <p>
                Create your account to monitor farm produce,
                connect with buyers, receive AI-powered crop
                diagnosis, and grow your agricultural business.
            </p>

        </section>


        <!-- RIGHT SIDE -->
        <section class="auth-right">

            <div class="auth-form-wrapper">

                <!-- LOGO -->
                <img class="auth-brand" src="/static/assets/logo/Agro-Shield_logo.png" alt="Agro-Shield">

                <!-- REGISTRATION FORM -->
                <form id="register-form" action="/register" method="POST">

                    <h2>Create Account</h2>


                    <!-- ROLE -->
                    <label>How would you like to use Agro-Shield?</label>

                    <div class="row role-select">

                        <label class="role-option">
                            <input type="radio" name="role" value="farmer" checked>

                            <span>
                                🌾 Farmer
                            </span>
                        </label>

                        <label class="role-option">
                            <input type="radio" name="role" value="buyer">

                            <span>
                                🛒 Buyer
                            </span>
                        </label>

                        <a class="role-option learning-role-option" href="/learning">
                            <span>
                                📘 Learn about farming
                                <small>No account needed to start learning</small>
                            </span>
                        </a>

                    </div>


                    <!-- FIRST NAME + LAST NAME -->
                    <div class="row">

                        <div class="form-group">

                            <label for="first-name">
                                First Name
                            </label>

                            <input name="first-name" type="text" id="first-name" placeholder="First Name"
                                autocomplete="given-name" required>

                        </div>

                        <div class="form-group">

                            <label for="last-name">
                                Last Name
                            </label>

                            <input name="last-name" type="text" id="last-name" placeholder="Last Name"
                                autocomplete="family-name" required>

                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input name="email" type="email" id="email" placeholder="Enter your email" autocomplete="email"
                            required>

                    </div>


                    <!-- PHONE -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input name="phone" type="tel" id="phone" placeholder="Enter your phone number"
                            autocomplete="tel" required>

                    </div>


                    <!-- LOCATION -->
                    <div class="form-group">
                        <label for="community">Community / Village</label>
                        <input name="community" type="text" id="community" autocomplete="address-level2" required>
                    </div>
                    <div class="form-group">
                        <label for="state-select">State</label>
                        <select name="state" id="state-select" data-state-select data-selected="" autocomplete="address-level1" required>
                            <option value="">Choose a country first</option>
                        </select>
                        <input name="state" id="state-text" data-state-text autocomplete="address-level1" required hidden disabled>
                    </div>
                    <div class="form-group">
                        <label for="lga-select">Local Government Area (LGA)</label>
                        <select name="lga" id="lga-select" data-lga-select autocomplete="address-level3" required disabled>
                            <option value="">Choose a state first</option>
                        </select>
                        <input name="lga" id="lga-text" data-lga-text autocomplete="address-level3" required hidden disabled>
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input name="country" type="text" id="country" data-country-field value="Nigeria" autocomplete="country-name" required>
                        <small id="location-directory-status" role="status" aria-live="polite"></small>
                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input name="password" type="password" id="password" placeholder="Create password"
                                autocomplete="new-password" required>

                            <i class="fa-solid fa-eye toggle-password" id="toggle-password" aria-label="Show password"
                                role="button" tabindex="0"></i>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input name="confirm-password" type="password" id="confirm-password"
                                placeholder="Confirm password" autocomplete="new-password" required>

                            <i class="fa-solid fa-eye toggle-password" id="toggle-confirm-password"
                                aria-label="Show confirm password" role="button" tabindex="0"></i>

                        </div>

                    </div>


                    <!-- SUBMIT -->
                    <button type="submit">
                        Create Account
                    </button>


                    <!-- LOGIN LINK -->
                    <p class="auth-footer">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <script src="/static/js/location-fields.js"></script>
    <script src="/static/js/register.js"></script>

</body>

</html>
